services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: embedo-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-embedo_user}
      # No insecure default: deploy fails loudly if POSTGRES_PASSWORD is unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-embedo_db}
    # Loopback only (UFW also blocks 5432). From a laptop: ssh -L 5432:127.0.0.1:5432 root@<vps>
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-embedo_user} -d ${POSTGRES_DB:-embedo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - embedo-network

  redis:
    image: redis:7-alpine
    container_name: embedo-prod-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - embedo-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: embedo-prod-api
    restart: always
    command: node dist/server.js
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    # Bound to loopback ONLY: the API must be reached through the Nginx reverse proxy (TLS,
    # and so X-Forwarded-For cannot be spoofed to defeat IP rate limits).
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - embedo-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: embedo-prod-worker
    restart: always
    command: node dist/worker.js
    # The image's default HEALTHCHECK curls the API port (4000), which the worker never serves, so it
    # reported "unhealthy" forever while processing jobs normally. Check what a worker actually needs:
    # its process is running AND Redis (its job queue) is reachable.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          grep -qa 'dist/[w]orker.js' /proc/[0-9]*/cmdline &&
          node -e "const R=require('ioredis');const r=new R(process.env.REDIS_URL,{lazyConnect:true,connectTimeout:3000,maxRetriesPerRequest:1});r.connect().then(()=>r.ping()).then(()=>process.exit(0)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - embedo-network

volumes:
  postgres_data:
  redis_data:

networks:
  embedo-network:
    driver: bridge
